name: Build RPM package for openSUSE Tumbleweed

#on:
#  push:
#    tags:
#      - 'v*'
on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  rpm-build:
    runs-on: ubuntu-latest
    container:
      image: opensuse/tumbleweed:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          zypper ar -G https://download.opensuse.org/repositories/home:/pvarkoly:/CRANIX/openSUSE_Tumbleweed/ CRANIX
          zypper --non-interactive refresh
          zypper --non-interactive install -y \
            python3 python3-devel python3-setuptools python3-wheel python3-pip \
            python3-build python3-requests python3-bashconfigparser \
            rpm-build rsync gzip tar

      - name: Build Python wheel and sdist
        run: |
          python3 -m build
          ls -l dist

      - name: Prepare source tarball for RPM build
        run: |
          VERSION=$(tr -d '\n' < VERSION)
          NAME="cranix-python-ms365"
          SRC_DIR="/tmp/${NAME}-${VERSION}"
          rm -rf "${SRC_DIR}"
          mkdir -p "${SRC_DIR}"
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='dist' \
            --exclude='build' \
            --exclude='*.egg-info' \
            --exclude='.pytest_cache' \
            ./ "${SRC_DIR}/"
          tar -C /tmp -czf "/tmp/${NAME}-${VERSION}.tar.gz" "${NAME}-${VERSION}"
          ls -l "/tmp/${NAME}-${VERSION}.tar.gz"

      - name: Create RPM spec
        run: |
          cat > /tmp/cranix-python-ms365.spec <<'SPEC'
          Name:           cranix-python-ms365
          Version:        %(cat /tmp/cranix-version.txt)
          Release:        1
          Summary:        Microsoft 365 synchronization helpers for CRANIX
          License:        Other
          URL:            https://github.com/Cranix-Solutions/cranix-python-ms365
          Source0:        %{name}-%{version}.tar.gz

          BuildArch:      noarch
          BuildRequires:  python3-devel python3-setuptools python3-wheel python3-pip python3-build
          Requires:       python3 >= 3.11
          Requires:       python3-cranix
          Requires:       python3-requests
          Requires:       python3-bashconfigparser

          %description
          Microsoft 365 synchronization helpers for CRANIX

          %package -n cranix-ms365
          Summary:        CRANIX plugin to synchronize users and groups with MS365
          Requires:       cranix-python-ms365 = %{version}-%{release}
          Requires:       python3-cranix
          Requires:       python3-requests
          Requires:       python3-bashconfigparser
          Requires:       bash
          Requires:       coreutils

          %description -n cranix-ms365
          CRANIX plugin to synchronize users and groups with MS365

          %prep
          %setup -q -n %{name}-%{version}

          %build
          python3 -m build

          %install
          mkdir -p %{buildroot}%{python3_sitelib}
          python3 -m pip install --no-deps --root=%{buildroot} --prefix=/usr dist/*.whl
          mkdir -p %{buildroot}/usr/share/cranix/tools/ms365
          mkdir -p %{buildroot}/usr/share/cranix/plugins/{add_group,add_user,change_member,delete_user,modify_user}
          mkdir -p %{buildroot}/opt/cranix-ms365
          mkdir -p %{buildroot}/var/adm/cranix/ms365/{failed,userids,groupids}
          install -m 755 tools/* %{buildroot}/usr/share/cranix/tools/ms365/
          install -m 755 plugins/add_group/200-ms365.py     %{buildroot}/usr/share/cranix/plugins/add_group/
          install -m 755 plugins/add_user/200-ms365.py      %{buildroot}/usr/share/cranix/plugins/add_user/
          install -m 755 plugins/change_member/200-ms365.py %{buildroot}/usr/share/cranix/plugins/change_member/
          install -m 755 plugins/delete_user/200-ms365.py   %{buildroot}/usr/share/cranix/plugins/delete_user/
          install -m 755 plugins/modify_user/200-ms365.py   %{buildroot}/usr/share/cranix/plugins/modify_user/
          install -m 644 opt/config %{buildroot}/opt/cranix-ms365/config

          %files
          %license LICENSE
          %doc README.md
          %{python3_sitelib}/cranix_ms365/
          %{python3_sitelib}/cranix_ms365-*.dist-info/

          %files -n cranix-ms365
          %license LICENSE
          %doc README.md
          %dir /opt/cranix-ms365/
          %config(noreplace) /opt/cranix-ms365/config
          /usr/share/cranix/plugins/*/*
          /usr/share/cranix/tools/ms365
          %dir /var/adm/cranix/ms365
          %dir /var/adm/cranix/ms365/failed
          %dir /var/adm/cranix/ms365/userids
          %dir /var/adm/cranix/ms365/groupids

          %changelog
          * %(date +"%a %b %d %Y") CI <ci@example.com> - %{version}-1
          - Automated RPM build for openSUSE Tumbleweed
          SPEC

          # Store version for RPM spec macro expansion
          tr -d '\n' < VERSION > /tmp/cranix-version.txt

      - name: Build RPM
        run: |
          mkdir -p /root/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          NAME="cranix-python-ms365"
          VERSION=$(tr -d '\n' < VERSION)
          cp "/tmp/${NAME}-${VERSION}.tar.gz" /usr/src/packages/SOURCES/
          cp /tmp/${NAME}.spec /usr/src/packages/SPECS/
          rpmbuild -ba /usr/src/packages/SPECS/${NAME}.spec

      - name: Upload RPM as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: cranix-ms365-rpm-opensuse-tumbleweed
          path: /usr/src/packages/RPMS/noarch/*.rpm
          if-no-files-found: error
          retention-days: 30

      - name: Upload RPM to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: /usr/src/packages/RPMS/noarch/*.rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: rpm-build
    runs-on: ubuntu-latest
    steps:
      - name: Download RPM artifacts
        uses: actions/download-artifact@v4
        with:
          name: cranix-ms365-rpm-opensuse-tumbleweed
          path: ./artifacts

      - name: Deploy RPMs to Repository Server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.REPO_SERVER_URL }}
          port: ${{ secrets.REPO_SERVER_PORT }}
          username: github-deploy
          key: ${{ secrets.REPO_SERVER_SSH_KEY }}
          source: "./artifacts/*.rpm"
          target: "/srv/www/repo/github"
          # Do not use 'rm: true' as it would delete existing packages
          overwrite: true
